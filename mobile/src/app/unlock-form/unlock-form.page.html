<ion-header>
  <ion-toolbar>
    <ion-title>{{ isEdit ? 'Editar Desbloqueo' : 'Nuevo Desbloqueo' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="loading" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando información...</p>
  </div>

  <form *ngIf="!loading" [formGroup]="unlockForm" (ngSubmit)="saveUnlock()">
    <ion-list>
      <ion-item>
        <ion-label position="stacked">Fecha de Desbloqueo *</ion-label>
        <ion-input
          type="datetime-local"
          formControlName="unlocked_at"
        ></ion-input>
      </ion-item>
      <div *ngIf="getError('unlocked_at')" class="validation-error">
        {{ getError('unlocked_at') }}
      </div>

      <ion-item>
        <ion-label position="stacked">ID Pareja (couidfk) *</ion-label>
        <ion-input
          type="number"
          formControlName="couidfk"
          placeholder="1"
        ></ion-input>
      </ion-item>
      <div *ngIf="getError('couidfk')" class="validation-error">
        {{ getError('couidfk') }}
      </div>

      <ion-item>
        <ion-label position="stacked">ID Logro (achidfk) *</ion-label>
        <ion-input
          type="number"
          formControlName="achidfk"
          placeholder="1"
        ></ion-input>
      </ion-item>
      <div *ngIf="getError('achidfk')" class="validation-error">
        {{ getError('achidfk') }}
      </div>
    </ion-list>

    <div class="ion-margin-top">
      <ion-button expand="block" type="submit" [disabled]="saving">
        <ion-spinner *ngIf="saving" name="crescent" slot="start"></ion-spinner>
        {{ isEdit ? 'Actualizar Desbloqueo' : 'Registrar Desbloqueo' }}
      </ion-button>
    </div>
  </form>
</ion-content>
