<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tag-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle de Etiqueta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="errorMessage">
    <p class="ion-padding">{{ errorMessage }}</p>
  </ion-text>

  <ion-card *ngIf="tag as detail">
    <ion-card-header>
      <ion-card-title>
        🏷️ {{ detail.keyword }}
      </ion-card-title>
      <ion-card-subtitle>
        ID de Etiqueta #{{ detail.tagid }}
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <p>ID</p>
            <h2>{{ detail.tagid }}</h2>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <p>Palabra Clave</p>
            <h2>{{ detail.keyword }}</h2>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
