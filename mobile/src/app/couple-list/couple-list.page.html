<app-toolbar nombre="Parejas"></app-toolbar>

<ion-content>
  <div class="ion-text-end ion-padding-end ion-margin-top">
    <ion-button color="primary" (click)="newCouple()">
      <ion-icon name="add" slot="start"></ion-icon>
      Nueva Pareja
    </ion-button>
  </div>

    <ion-searchbar [value]="busqueda" [debounce]="300" (ionInput)="handleInput($event)" placeholder="Buscar parejas" aria-label="Buscar parejas"></ion-searchbar>
  <p class="ion-padding" *ngIf="total === 0">No se encontraron parejas.</p>
  <ion-list>
    <ion-item-sliding *ngFor="let couple of couples">
      <ion-item>
        <ion-label>
          <h2>Pareja #{{ couple.couid }}</h2>
          <p>Inicio: {{ couple.start_date | date:'yyyy-MM-dd' }} | Última interacción: {{ couple.last_interaction | date:'yyyy-MM-dd HH:mm' }}</p>
        </ion-label>
        <ion-badge slot="end" color="primary">{{ couple.total_xp }} XP</ion-badge>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="warning" (click)="editCouple(couple.couid)">
          <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="primary" [routerLink]="['/couple-view', couple.couid]">
          <ion-icon slot="icon-only" name="eye-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="confirmarEliminar(couple.couid)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

    <ion-item *ngIf="couples.length === 0">
      <ion-label class="ion-text-center">No hay parejas registradas.</ion-label>
    </ion-item>
  </ion-list>

  <app-paginacion
    [total]="total"
    [porPagina]="porPagina"
    [paginaActual]="paginaActual"
    (paginaCambio)="cambiarPagina($event)"
  ></app-paginacion>
</ion-content>
