<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/achievement-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle del Logro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="errorMessage">
    <p class="ion-padding">{{ errorMessage }}</p>
  </ion-text>

  <ion-card *ngIf="achievement as detail">
    <ion-card-header>
      <ion-card-title>
        🏆 {{ detail.name }}
      </ion-card-title>
      <ion-card-subtitle>
        Bono: +{{ detail.xp_bonus }} XP
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <p>ID del Logro</p>
            <h2>#{{ detail.achid }}</h2>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <p>Bono de Experiencia</p>
            <h2>+{{ detail.xp_bonus }} XP</h2>
          </ion-label>
        </ion-item>

        <ion-item class="ion-text-wrap">
          <ion-label>
            <p>Criterio de Desbloqueo</p>
            <pre>{{ getCriteriaString(detail.criteria) }}</pre>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
