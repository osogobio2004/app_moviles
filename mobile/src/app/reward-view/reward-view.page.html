<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/reward-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle de Recompensa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="errorMessage">
    <p class="ion-padding">{{ errorMessage }}</p>
  </ion-text>

  <ion-card *ngIf="reward as detail">
    <ion-card-header>
      <ion-card-title>
        {{ detail.item_name }}
      </ion-card-title>
      <ion-card-subtitle>
        Tipo: {{ detail.item_type | uppercase }}
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <p>ID de Recompensa</p>
            <h2>{{ detail.rewid }}</h2>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <p>Costo en XP</p>
            <h2>{{ detail.cost_xp }} XP</h2>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <p>Rango Requerido (Rank ID)</p>
            <h2>{{ detail.rank_ranid }}</h2>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
