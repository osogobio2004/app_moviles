<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/status-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle de Estado</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="errorMessage">
    <p class="ion-padding">{{ errorMessage }}</p>
  </ion-text>

  <ion-card *ngIf="status as detail">
    <ion-card-header>
      <ion-card-title>
        📌 {{ detail.description }}
      </ion-card-title>
      <ion-card-subtitle>
        ID de Estado #{{ detail.staid }}
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <p>Identificador</p>
            <h2>{{ detail.staid }}</h2>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <p>Descripción / Valor</p>
            <h2>{{ detail.description }}</h2>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
