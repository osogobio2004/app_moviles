<app-toolbar nombre="Perfiles"></app-toolbar>

<ion-content>
  <div class="ion-text-end ion-padding-end ion-margin-top">
    <ion-button color="primary" (click)="newProfile()">
      <ion-icon name="add" slot="start"></ion-icon>
      Nuevo Perfil
    </ion-button>
  </div>

    <ion-searchbar [value]="busqueda" [debounce]="300" (ionInput)="handleInput($event)" placeholder="Buscar perfiles" aria-label="Buscar perfiles"></ion-searchbar>
  <p class="ion-padding" *ngIf="total === 0">No se encontraron perfiles.</p>
  <ion-list>
    <ion-item-sliding *ngFor="let profile of profiles">
      <ion-item>
        <ion-avatar slot="start" *ngIf="profile.avatar">
          <img [src]="profile.avatar" alt="Avatar" onerror="this.src='https://ionicframework.com/docs/img/demos/avatar.svg'" />
        </ion-avatar>
        <ion-label>
          <h2>{{ profile.nickname }}</h2>
          <p>Nacimiento: {{ profile.birthdate | date:'yyyy-MM-dd' }} | Pareja ID: {{ profile.couidfk }}</p>
        </ion-label>
        <ion-button fill="clear" color="secondary" slot="end" [routerLink]="['/profile-imagen', profile.proid]" aria-label="Subir avatar">
          <ion-icon slot="icon-only" name="camera"></ion-icon>
        </ion-button>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="secondary" [routerLink]="['/profile-imagen', profile.proid]">
          <ion-icon slot="icon-only" name="camera-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="warning" (click)="editProfile(profile.proid)">
          <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="primary" [routerLink]="['/profile-view', profile.proid]">
          <ion-icon slot="icon-only" name="eye-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="confirmarEliminar(profile.proid, profile.nickname)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

    <ion-item *ngIf="profiles.length === 0">
      <ion-label class="ion-text-center">No hay perfiles registrados.</ion-label>
    </ion-item>
  </ion-list>

  <app-paginacion
    [total]="total"
    [porPagina]="porPagina"
    [paginaActual]="paginaActual"
    (paginaCambio)="cambiarPagina($event)"
  ></app-paginacion>
</ion-content>
