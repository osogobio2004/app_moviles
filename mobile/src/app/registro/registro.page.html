<ion-header>
  <ion-toolbar color="personalizado">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="registrar()">
    <ion-input
      label="Nombre"
      labelPlacement="stacked"
      formControlName="nombre"
      autocomplete="given-name"
      placeholder="Tu nombre"
    ></ion-input>

    <ion-input
      label="Correo"
      labelPlacement="stacked"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="correo@ejemplo.com"
    ></ion-input>

    <ion-input
      label="Contraseña"
      labelPlacement="stacked"
      type="password"
      formControlName="password"
      autocomplete="new-password"
      placeholder="Mínimo 8 caracteres"
    ></ion-input>

    <ion-note color="danger" *ngIf="form.touched && form.invalid">
      Completa el nombre, un correo válido y una contraseña de al menos 8 caracteres.
    </ion-note>

    <p *ngIf="mensaje" role="status" class="ion-text-info">{{ mensaje }}</p>

    <ion-button
      fill="solid"
      color="personalizado"
      expand="block"
      type="submit"
      [disabled]="enviando"
      class="ion-margin-top"
    >
      {{ enviando ? 'Enviando...' : 'Registrarme' }}
    </ion-button>
  </form>
</ion-content>
