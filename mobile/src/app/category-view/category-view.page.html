<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/category-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle de Categoría</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="errorMessage">
    <p class="ion-padding">{{ errorMessage }}</p>
  </ion-text>

  <ion-card *ngIf="category as detail">
    <ion-card-header>
      <ion-card-title>
        <span class="color-indicator" [style.background-color]="detail.color_hex"></span>
        {{ detail.name }}
      </ion-card-title>
      <ion-card-subtitle>
        Estado: {{ detail.is_active ? 'Activa' : 'Inactiva' }}
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <p>ID de Categoría</p>
            <h2>#{{ detail.catid }}</h2>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <p>Color</p>
            <h2>{{ detail.color_hex }}</h2>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <p>Recompensa Base en XP</p>
            <h2>+{{ detail.xp_value }} XP</h2>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <p>Habilitada / Activa</p>
            <h2>{{ detail.is_active ? 'Sí' : 'No' }}</h2>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
