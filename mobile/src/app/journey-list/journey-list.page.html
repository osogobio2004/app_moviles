<app-toolbar nombre="Viajes"></app-toolbar>

<ion-content>
    <ion-searchbar [value]="busqueda" [debounce]="300" (ionInput)="handleInput($event)" placeholder="Buscar viajes" aria-label="Buscar viajes"></ion-searchbar>
  <p class="ion-padding" *ngIf="total === 0">No se encontraron viajes.</p>
  <ion-list>
    <ion-item *ngFor="let journey of journeys">
      <ion-label class="ion-text-wrap">
        <h2>{{ journey.destination }}</h2>
        <p><strong>Presupuesto:</strong> ${{ journey.budget | number:'1.2-2' }} MXN</p>
        <p><strong>Fecha planeada:</strong> {{ journey.planned_day | date:'yyyy-MM-dd' }}</p>
        <p *ngIf="journey.visited_at">
          <strong>Visitado el:</strong> {{ journey.visited_at | date:'yyyy-MM-dd HH:mm' }}
        </p>
        <p><strong>Estado:</strong> {{ getStatusDescription(journey.staidfk) }}</p>
      </ion-label>

      <ion-button fill="clear" color="warning" (click)="editJourney(journey.jouid)" title="Editar">
        <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>

      <ion-button fill="clear" color="primary" [routerLink]="['/journey-view', journey.jouid]" title="Ver detalle">
        <ion-icon slot="icon-only" name="eye"></ion-icon>
      </ion-button>

      <ion-button fill="clear" color="danger" (click)="confirmarEliminar(journey.jouid, journey.destination)" title="Eliminar">
        <ion-icon slot="icon-only" name="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <app-paginacion
    [total]="total"
    [porPagina]="porPagina"
    [paginaActual]="paginaActual"
    [maxPaginasVisibles]="5"
    (paginaCambio)="cambiarPagina($event)"
  ></app-paginacion>

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="newJourney()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
