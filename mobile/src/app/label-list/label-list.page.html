<app-toolbar nombre="Etiquetas de Recuerdos"></app-toolbar>

<ion-content>
  <div class="ion-text-end ion-padding-end ion-margin-top">
    <ion-button color="primary" (click)="newLabel()">
      <ion-icon name="add" slot="start"></ion-icon>
      Nueva Asignación
    </ion-button>
  </div>

    <ion-searchbar [value]="busqueda" [debounce]="300" (ionInput)="handleInput($event)" placeholder="Buscar asignaciones de etiquetas" aria-label="Buscar asignaciones de etiquetas"></ion-searchbar>
  <p class="ion-padding" *ngIf="total === 0">No se encontraron asignaciones de etiquetas.</p>
  <ion-list>
    <ion-item-sliding *ngFor="let item of labels">
      <ion-item>
        <ion-icon name="pricetag-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h2>Recuerdo #{{ item.memidfk }} ↔ Etiqueta #{{ item.tagidfk }}</h2>
          <p>Asignado: {{ item.assigment_at | date:'yyyy-MM-dd HH:mm' }} | ID: #{{ item.labid }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="warning" (click)="editLabel(item.labid)">
          <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="primary" [routerLink]="['/label-view', item.labid]">
          <ion-icon slot="icon-only" name="eye-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="confirmarEliminar(item.labid)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

    <ion-item *ngIf="labels.length === 0">
      <ion-label class="ion-text-center">No hay asignaciones registradas.</ion-label>
    </ion-item>
  </ion-list>

  <app-paginacion
    [total]="total"
    [porPagina]="porPagina"
    [paginaActual]="paginaActual"
    (paginaCambio)="cambiarPagina($event)"
  ></app-paginacion>
</ion-content>
