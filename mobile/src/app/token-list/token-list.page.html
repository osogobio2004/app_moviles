<app-toolbar nombre="Tokens de Acceso"></app-toolbar>

<ion-content>
  <div class="ion-text-end ion-padding-end ion-margin-top">
    <ion-button color="primary" (click)="newToken()">
      <ion-icon name="add" slot="start"></ion-icon>
      Nuevo Token
    </ion-button>
  </div>

    <ion-searchbar [value]="busqueda" [debounce]="300" (ionInput)="handleInput($event)" placeholder="Buscar tokens" aria-label="Buscar tokens"></ion-searchbar>
  <p class="ion-padding" *ngIf="total === 0">No se encontraron tokens.</p>
  <ion-list>
    <ion-item-sliding *ngFor="let token of tokens">
      <ion-item>
        <ion-icon name="key-outline" slot="start" color="tertiary"></ion-icon>
        <ion-label>
          <h2 class="token-code">{{ token.code }}</h2>
          <p>Pareja #{{ token.couidfk }} | Expira: {{ token.expires_at | date:'yyyy-MM-dd HH:mm' }}</p>
        </ion-label>
        <ion-badge slot="end" [color]="token.is_used ? 'medium' : 'success'">
          {{ token.is_used ? 'Usado' : 'Activo' }}
        </ion-badge>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="warning" (click)="editToken(token.tokid)">
          <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="primary" [routerLink]="['/token-view', token.tokid]">
          <ion-icon slot="icon-only" name="eye-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="confirmarEliminar(token.tokid, token.code)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

    <ion-item *ngIf="tokens.length === 0">
      <ion-label class="ion-text-center">No hay tokens registrados.</ion-label>
    </ion-item>
  </ion-list>

  <app-paginacion
    [total]="total"
    [porPagina]="porPagina"
    [paginaActual]="paginaActual"
    (paginaCambio)="cambiarPagina($event)"
  ></app-paginacion>
</ion-content>
