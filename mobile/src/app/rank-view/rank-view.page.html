<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/rank-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle del Rango</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="errorMessage">
    <p class="ion-padding">{{ errorMessage }}</p>
  </ion-text>

  <ion-card *ngIf="rank as detail">
    <div class="badge-display" *ngIf="detail.badge_icon">
      <span>{{ detail.badge_icon }}</span>
    </div>

    <ion-card-header>
      <ion-card-title>
        🎖️ {{ getRankTitle(detail) }}
      </ion-card-title>
      <ion-card-subtitle>
        Rango #{{ detail.ranid }}
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <p>ID de Rango</p>
            <h2>#{{ detail.ranid }}</h2>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <p>XP Mínimo Requerido</p>
            <h2>{{ detail.min_xp }} XP</h2>
          </ion-label>
        </ion-item>

        <ion-item *ngIf="detail.badge_icon">
          <ion-label>
            <p>Insignia / Ícono</p>
            <h2>{{ detail.badge_icon }}</h2>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
