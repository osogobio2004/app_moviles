<app-toolbar nombre="Desbloqueos de Logros"></app-toolbar>

<ion-content>
  <div class="ion-text-end ion-padding-end ion-margin-top">
    <ion-button color="primary" (click)="newUnlock()">
      <ion-icon name="add" slot="start"></ion-icon>
      Nuevo Desbloqueo
    </ion-button>
  </div>

    <ion-searchbar [value]="busqueda" [debounce]="300" (ionInput)="handleInput($event)" placeholder="Buscar desbloqueos" aria-label="Buscar desbloqueos"></ion-searchbar>
  <p class="ion-padding" *ngIf="total === 0">No se encontraron desbloqueos.</p>
  <ion-list>
    <ion-item-sliding *ngFor="let item of unlocks">
      <ion-item>
        <ion-icon name="trophy-outline" slot="start" color="warning"></ion-icon>
        <ion-label>
          <h2>Pareja #{{ item.couidfk }} ↔ Logro #{{ item.achidfk }}</h2>
          <p>Desbloqueado: {{ item.unlocked_at | date:'yyyy-MM-dd HH:mm' }} | ID: #{{ item.unlid }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="warning" (click)="editUnlock(item.unlid)">
          <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="primary" [routerLink]="['/unlock-view', item.unlid]">
          <ion-icon slot="icon-only" name="eye-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="confirmarEliminar(item.unlid)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

    <ion-item *ngIf="unlocks.length === 0">
      <ion-label class="ion-text-center">No hay desbloqueos registrados.</ion-label>
    </ion-item>
  </ion-list>

  <app-paginacion
    [total]="total"
    [porPagina]="porPagina"
    [paginaActual]="paginaActual"
    (paginaCambio)="cambiarPagina($event)"
  ></app-paginacion>
</ion-content>
