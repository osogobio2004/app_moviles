<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/images-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Subir imagen de recuerdo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p><strong>Imagen de Recuerdo #{{ idImagen }}</strong></p>
  
  <ion-item lines="none" class="file-selector-item">
    <ion-label position="stacked">Selecciona una imagen desde tu dispositivo:</ion-label>
    <input id="archivo" type="file" accept="image/*" (change)="onFileSelected($event)">
  </ion-item>

  <ion-button fill="solid" expand="block" (click)="subir()" [disabled]="!archivo || enviando" class="ion-margin-top">
    <ion-icon name="cloud-upload-outline" slot="start"></ion-icon>
    {{ enviando ? 'Subiendo archivo...' : 'Subir imagen' }}
  </ion-button>

  <ion-text [color]="mensaje.includes('correctamente') ? 'success' : 'danger'" *ngIf="mensaje">
    <p role="status" class="ion-margin-top">{{ mensaje }}</p>
  </ion-text>

  <div *ngIf="imagenUrl" class="preview-container ion-margin-top">
    <p><strong>Vista previa de la imagen actual:</strong></p>
    <img [src]="imagenUrl" alt="Imagen guardada del recuerdo" class="preview">
  </div>
</ion-content>
