services:

  db:
    image: mariadb:11.8
    container_name: moviles-db
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: moviles
      MARIADB_USER: moviles
      MARIADB_PASSWORD: moviles123

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - moviles

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: moviles-cloudbeaver
    restart: unless-stopped

    ports:
      - "8978:8978"

    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace

    depends_on:
      db:
        condition: service_healthy

    networks:
      - moviles

  api:
    build:
      context: ./api

    container_name: moviles-api
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: moviles
      DB_USER: moviles
      DB_PASSWORD: moviles123

    ports:
      - "8000:8000"

    volumes:
      - ./api/app:/code/app

    depends_on:
      db:
        condition: service_healthy

    networks:
      - moviles


  mobile:
    build:
      context: ./mobile

    container_name: moviles-ionic
    restart: unless-stopped

    ports:
      - "8100:8100"

    volumes:
      - ./mobile:/app
      - ionic_node_modules:/app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - api

    networks:
      - moviles

    stdin_open: true
    tty: true


volumes:
  mariadb_data:
  ionic_node_modules:
  cloudbeaver_data:


networks:
  moviles:
    driver: bridge